name: CI

on:
  push:
    branches: [main, "docs/m1-task-cards"]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test and AOT smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            app: src/Yaapic.App.WinUI
            exe: Yaapic.App.WinUI.exe
            solution: Yaapic.sln
          - os: ubuntu-latest
            rid: linux-x64
            app: src/Yaapic.App.Avalonia
            exe: Yaapic.App.Avalonia
            solution: Yaapic.CrossPlatform.slnf
          - os: macos-latest
            rid: osx-arm64
            app: src/Yaapic.App.Avalonia
            exe: Yaapic.App.Avalonia
            solution: Yaapic.CrossPlatform.slnf
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install native AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev xvfb

      - name: Cache native script engine sources
        uses: actions/cache@v4
        with:
          path: artifacts/native/_src
          key: native-src-${{ hashFiles('native/versions.json') }}

      - name: Build native script engines (QuickJS-NG, Lua)
        shell: pwsh
        run: ./native/Build-Natives.ps1 -Rid ${{ matrix.rid }}

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: |
            artifacts/native/${{ matrix.rid }}
            !artifacts/native/${{ matrix.rid }}/.built
          include-hidden-files: false
          if-no-files-found: error

      - name: Check formatting
        if: runner.os == 'Linux'
        run: dotnet format ${{ matrix.solution }} --verify-no-changes

      - name: Build
        run: dotnet build ${{ matrix.solution }} -c Release

      - name: Test (architecture and token snapshot tests included)
        run: dotnet test --solution ${{ matrix.solution }} -c Release --no-build

      - name: Publish with Native AOT
        run: dotnet publish ${{ matrix.app }} -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o publish

      - name: Publish and run the native engine smoke test (Native AOT)
        shell: pwsh
        run: |
          dotnet publish tools/NativeSmoke -c Release -r ${{ matrix.rid }} -o smoke
          if ($LASTEXITCODE -ne 0) { throw 'The NativeSmoke publish failed.' }
          $smoke = Join-Path smoke ($IsWindows ? 'NativeSmoke.exe' : 'NativeSmoke')
          if (-not $IsWindows) { chmod +x $smoke }
          $out = & $smoke
          if ($LASTEXITCODE -ne 0 -or ($out -join '') -ne 'OK') { throw "NativeSmoke failed (exit $LASTEXITCODE): $out" }

      - name: Smoke test the published binary
        shell: pwsh
        run: |
          $exe = Join-Path publish '${{ matrix.exe }}'
          if ($IsLinux) { chmod +x $exe; $p = Start-Process xvfb-run -ArgumentList '-a', $exe -PassThru }
          else { $p = Start-Process $exe -PassThru }
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "The app exited early with code $($p.ExitCode)." }
          if ($IsWindows) {
            if (-not $p.CloseMainWindow()) { throw 'The app has no main window.' }
            if (-not $p.WaitForExit(15000)) { $p.Kill($true); throw 'The app did not close.' }
            if ($p.ExitCode -ne 0) { throw "The app exited with code $($p.ExitCode)." }
          } else {
            # No clean close from outside on Linux/macOS: a live process after 10 s proves startup.
            Stop-Process -Id $p.Id -Force
          }
