name: CI

on:
  push:
    branches: [main, "docs/m1-task-cards"]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test and AOT smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            app: src/Yaapic.App.WinUI
            exe: Yaapic.App.WinUI.exe
            solution: Yaapic.sln
          - os: ubuntu-latest
            rid: linux-x64
            app: src/Yaapic.App.Avalonia
            exe: Yaapic.App.Avalonia
            solution: Yaapic.CrossPlatform.slnf
          - os: macos-latest
            rid: osx-arm64
            app: src/Yaapic.App.Avalonia
            exe: Yaapic.App.Avalonia
            solution: Yaapic.CrossPlatform.slnf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install native AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev xvfb

      - name: Check formatting
        if: runner.os == 'Linux'
        run: dotnet format ${{ matrix.solution }} --verify-no-changes

      - name: Build
        run: dotnet build ${{ matrix.solution }} -c Release

      - name: Test (architecture and token snapshot tests included)
        run: dotnet test --solution ${{ matrix.solution }} -c Release --no-build

      - name: Publish with Native AOT
        run: dotnet publish ${{ matrix.app }} -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o publish

      - name: Smoke test the published binary
        shell: pwsh
        run: |
          $exe = Join-Path publish '${{ matrix.exe }}'
          if ($IsLinux) { chmod +x $exe; $p = Start-Process xvfb-run -ArgumentList '-a', $exe -PassThru }
          else { $p = Start-Process $exe -PassThru }
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "The app exited early with code $($p.ExitCode)." }
          if ($IsWindows) {
            if (-not $p.CloseMainWindow()) { throw 'The app has no main window.' }
            if (-not $p.WaitForExit(15000)) { $p.Kill($true); throw 'The app did not close.' }
            if ($p.ExitCode -ne 0) { throw "The app exited with code $($p.ExitCode)." }
          } else {
            # No clean close from outside on Linux/macOS: a live process after 10 s proves startup.
            Stop-Process -Id $p.Id -Force
          }
