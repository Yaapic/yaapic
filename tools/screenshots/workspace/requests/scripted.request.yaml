version: 1
id: 11111111-0000-0000-0000-000000000009
name: Scripted
method: GET
url: "{{baseUrl}}/users"
params: []
headers: []
body:
  type: none
  contentType: json
  text: ""
scripts:
  preRequest:
    language: javascript
    source: |
      yaapic.request.headers.add({ key: "X-Trace", value: "scripted" });
      yaapic.environment.set("startedAt", Date.now().toString());
  postResponse:
    language: javascript
    source: |
      yaapic.test("Status is 200", () => yaapic.response.to.have.status(200));
      yaapic.test("Responds with JSON", () => yaapic.response.to.be.json);
      yaapic.test("Has two users", () => yaapic.expect(yaapic.response.json().length).to.equal(2));
      yaapic.test("Fails on purpose", () => yaapic.expect(1).to.equal(2));
      yaapic.test("Fails on a header", () => yaapic.response.to.have.header("X-Missing"));
